<style>
  @font-face {
    font-family: 'Gilroy';
    src: url('{{gilroy-black}}') format('woff2');
    font-weight: 900;
    font-display: block;
  }
  @font-face {
    font-family: 'Gilroy';
    src: url('{{gilroy-extrabold}}') format('woff2');
    font-weight: 800;
    font-display: block;
  }
  @font-face {
    font-family: 'Gilroy';
    src: url('{{gilroy-medium}}') format('woff2');
    font-weight: 500;
    font-display: block;
  }

  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    padding: 0;
    background: #0d0b18;
  }

  /* 16:9 — форма, в которой канал показывает пост во всю ширину.
     Рекламный квадрат сюда не годится: Telegram обрежет его по бокам. */
  .board {
    width: 1280px;
    height: 720px;
    position: relative;
    overflow: hidden;
    font-family: 'Gilroy', 'Helvetica Neue', Arial, sans-serif;
    color: #f3eff8;
    background:
      radial-gradient(58% 62% at 26% -8%, rgba(255, 226, 168, 0.18), transparent 62%),
      radial-gradient(74% 76% at 72% 54%, rgba(96, 66, 152, 0.44), transparent 74%),
      linear-gradient(180deg, #241f47 0%, #171331 56%, #0f0c20 100%);
  }

  .vig {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(74% 86% at 46% 46%, transparent 44%, rgba(8, 6, 18, 0.6) 100%);
  }

  .dust {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(2.5px 2.5px at 152px 108px, rgba(255, 230, 173, 0.8), transparent),
      radial-gradient(2px 2px at 1108px 122px, rgba(255, 230, 173, 0.55), transparent),
      radial-gradient(3px 3px at 1196px 428px, rgba(222, 0, 155, 0.5), transparent),
      radial-gradient(2px 2px at 612px 168px, rgba(116, 61, 245, 0.65), transparent),
      radial-gradient(2.5px 2.5px at 268px 636px, rgba(255, 230, 173, 0.4), transparent),
      radial-gradient(2px 2px at 892px 660px, rgba(255, 230, 173, 0.35), transparent);
  }

  /* Словомарк: только background-image — shorthand сбрасывает background-clip,
     и слово печатается сплошным прямоугольником. */
  .wm {
    position: absolute;
    right: 74px;
    top: 78px;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: -0.022em;
    line-height: 1;
    white-space: nowrap;
  }
  .wm i {
    font-style: normal;
  }
  .wm .l {
    color: #ffffff;
  }
  .wm .t {
    background-image: linear-gradient(100deg, #de009b 0%, #a32183 45%, #743df5 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .wm .n {
    background-image: linear-gradient(100deg, #f8bd3e 0%, #ffe6a3 50%, #f8bd3e 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .head {
    position: absolute;
    left: 76px;
    top: 76px;
    width: 660px;
  }
  .head .kicker {
    font-size: 19px;
    font-weight: 900;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #ffe6a3;
    margin-bottom: 16px;
  }
  .head .title {
    filter: drop-shadow(0 8px 22px rgba(248, 189, 62, 0.32));
  }
  .head .title span {
    display: inline-block;
    font-size: 88px;
    line-height: 0.92;
    font-weight: 900;
    letter-spacing: -0.02em;
    background-image: linear-gradient(178deg, #fff4d2 0%, #ffd873 28%, #f8bd3e 58%, #c8891a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .head .sub {
    margin-top: 18px;
    font-size: 27px;
    font-weight: 800;
    line-height: 1.32;
    color: #ded2ea;
    max-width: 620px;
  }
  .head .sub b {
    color: #ffffff;
    font-weight: 900;
  }

  img {
    display: block;
  }

  .pool {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(closest-side, rgba(248, 189, 62, 0.3), transparent 72%);
  }

  .tikki {
    position: absolute;
    left: 104px;
    bottom: 28px;
    height: 392px;
    filter: drop-shadow(0 26px 34px rgba(0, 0, 0, 0.55));
  }
  .pool-tikki {
    left: 116px;
    bottom: 4px;
    width: 340px;
    height: 70px;
    opacity: 0.5;
  }

  .engine {
    position: absolute;
    right: 104px;
    bottom: 116px;
    width: 336px;
    filter: drop-shadow(0 24px 40px rgba(0, 0, 0, 0.5))
      drop-shadow(0 0 34px rgba(248, 189, 62, 0.28));
  }
  .pool-engine {
    right: 112px;
    bottom: 84px;
    width: 316px;
    height: 84px;
  }

  .coin {
    position: absolute;
    filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.45));
  }
</style>

<div class="board">
  <span class="dust"></span>
  <span class="pool pool-tikki"></span>
  <span class="pool pool-engine"></span>

  <div class="wm"><i class="l">Lucky</i><i class="t">Ticket</i><i class="n">365</i></div>

  <div class="head">
    <div class="kicker">New on the home screen</div>
    <div class="title"><span>MEET TIKKI</span></div>
    <div class="sub">
      Tap him — he drops LC.<br />Your engines keep earning <b>while you're away</b>.
    </div>
  </div>

  <img class="tikki" src="{{tikki}}" alt="" />
  <img class="engine" src="{{engine}}" alt="" />

  <!-- Монеты идут от руки Тикки к движку — та же связка, что и в рекламе. -->
  <img class="coin" src="{{coin}}" style="left: 512px; top: 452px; width: 56px" alt="" />
  <img class="coin" src="{{coin}}" style="left: 588px; top: 428px; width: 48px" alt="" />
  <img class="coin" src="{{coin}}" style="left: 654px; top: 414px; width: 41px" alt="" />
  <img class="coin" src="{{coin}}" style="left: 712px; top: 408px; width: 34px" alt="" />
  <img class="coin" src="{{coin}}" style="left: 764px; top: 408px; width: 28px" alt="" />

  <span class="vig"></span>
</div>
