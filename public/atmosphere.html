<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Фон LuckyTicket365 — отдельно</title>
</head>
<body>

<style>
  /* ===========================================================================
     Слои фона — скопированы дословно из
     src/styles/components/atmosphere.css (коммит 0d7034a).
     Здесь ничего не «улучшено»: смотрим ровно то, что стоит на проде.
  =========================================================================== */

  .atmosphere {
    background:
      radial-gradient(
        125% 100% at 78% -6%,
        rgba(150, 96, 232, 0.5) 0%,
        rgba(101, 58, 179, 0.26) 26%,
        rgba(56, 34, 104, 0.12) 46%,
        rgba(27, 25, 48, 0) 66%
      ),
      radial-gradient(85% 70% at 6% 104%, rgba(30, 32, 78, 0.7) 0%, rgba(20, 18, 42, 0) 62%),
      linear-gradient(163deg, #191635 0%, #1b1930 42%, #131128 100%);
  }

  .atmosphere-rays {
    position: absolute;
    inset: 0;
    background:
      conic-gradient(
        from 178deg at 88% -6%,
        rgba(214, 188, 255, 0) 0deg,
        rgba(214, 188, 255, 0.1) 14deg,
        rgba(236, 218, 255, 0.16) 26deg,
        rgba(214, 188, 255, 0.07) 38deg,
        rgba(214, 188, 255, 0) 52deg
      ),
      repeating-conic-gradient(
        from 176deg at 88% -6%,
        rgba(232, 214, 255, 0) 0deg,
        rgba(232, 214, 255, 0.16) 1.6deg,
        rgba(232, 214, 255, 0) 4.2deg,
        rgba(232, 214, 255, 0) 8.4deg
      ),
      repeating-conic-gradient(
        from 183deg at 88% -6%,
        rgba(255, 255, 255, 0) 0deg,
        rgba(255, 255, 255, 0.1) 2.8deg,
        rgba(255, 255, 255, 0) 6.4deg,
        rgba(255, 255, 255, 0) 15deg
      );
    filter: blur(8px);
    -webkit-mask-image: radial-gradient(
      105% 100% at 88% -6%,
      rgba(0, 0, 0, 1) 0%,
      rgba(0, 0, 0, 0.72) 38%,
      rgba(0, 0, 0, 0.3) 66%,
      rgba(0, 0, 0, 0) 92%
    );
    mask-image: radial-gradient(
      105% 100% at 88% -6%,
      rgba(0, 0, 0, 1) 0%,
      rgba(0, 0, 0, 0.72) 38%,
      rgba(0, 0, 0, 0.3) 66%,
      rgba(0, 0, 0, 0) 92%
    );
    animation: atmosphere-rays-breathe 16s ease-in-out infinite;
  }

  @keyframes atmosphere-rays-breathe {
    0%,
    100% {
      opacity: 0.65;
    }
    50% {
      opacity: 1;
    }
  }

  .atmosphere-dust {
    position: absolute;
    inset: -160px;
    background-image:
      radial-gradient(1.5px 1.5px at 22px 34px, rgba(255, 255, 255, 0.55), transparent 62%),
      radial-gradient(1px 1px at 96px 14px, rgba(219, 196, 255, 0.5), transparent 62%),
      radial-gradient(1.2px 1.2px at 132px 88px, rgba(255, 255, 255, 0.4), transparent 62%),
      radial-gradient(1px 1px at 58px 118px, rgba(232, 196, 255, 0.45), transparent 62%),
      radial-gradient(1.6px 1.6px at 8px 96px, rgba(255, 255, 255, 0.3), transparent 62%),
      radial-gradient(1px 1px at 148px 46px, rgba(255, 255, 255, 0.35), transparent 62%);
    background-size: 160px 160px;
    opacity: 0.75;
    animation: atmosphere-dust-drift 44s linear infinite;
  }

  .atmosphere-dust::after {
    content: '';
    position: absolute;
    inset: -240px;
    background-image:
      radial-gradient(2.2px 2.2px at 40px 60px, rgba(255, 255, 255, 0.28), transparent 60%),
      radial-gradient(1.8px 1.8px at 170px 30px, rgba(206, 176, 255, 0.26), transparent 60%),
      radial-gradient(2.4px 2.4px at 120px 190px, rgba(255, 255, 255, 0.2), transparent 60%),
      radial-gradient(1.6px 1.6px at 216px 132px, rgba(238, 208, 255, 0.24), transparent 60%);
    background-size: 240px 240px;
    animation: atmosphere-dust-drift-far 78s linear infinite;
  }

  @keyframes atmosphere-dust-drift {
    from {
      transform: translate3d(0, 0, 0);
    }
    to {
      transform: translate3d(-160px, -160px, 0);
    }
  }

  @keyframes atmosphere-dust-drift-far {
    from {
      transform: translate3d(0, 0, 0);
    }
    to {
      transform: translate3d(240px, -240px, 0);
    }
  }

  .atmosphere-bokeh {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle 3px at 71% 15%, rgba(236, 220, 255, 0.85), transparent 70%),
      radial-gradient(circle 5px at 86% 31%, rgba(198, 113, 189, 0.45), transparent 70%),
      radial-gradient(circle 2px at 62% 42%, rgba(255, 255, 255, 0.7), transparent 70%),
      radial-gradient(circle 6px at 34% 22%, rgba(150, 110, 235, 0.32), transparent 70%),
      radial-gradient(circle 3px at 22% 68%, rgba(226, 206, 255, 0.4), transparent 70%),
      radial-gradient(circle 4px at 78% 74%, rgba(198, 113, 189, 0.3), transparent 70%),
      radial-gradient(circle 2px at 46% 88%, rgba(255, 255, 255, 0.35), transparent 70%);
    filter: blur(1.4px);
    animation: atmosphere-bokeh-pulse 9s ease-in-out infinite;
  }

  @keyframes atmosphere-bokeh-pulse {
    0%,
    100% {
      opacity: 0.7;
      transform: scale(1);
    }
    50% {
      opacity: 1;
      transform: scale(1.03);
    }
  }

  .atmosphere-vignette {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(
        to bottom,
        rgba(9, 8, 20, 0.34) 0%,
        rgba(9, 8, 20, 0.46) 9%,
        rgba(9, 8, 20, 0.36) 22%,
        rgba(9, 8, 20, 0.16) 34%,
        rgba(9, 8, 20, 0) 46%
      ),
      radial-gradient(
        125% 92% at 50% 42%,
        rgba(9, 8, 20, 0) 38%,
        rgba(9, 8, 20, 0.28) 74%,
        rgba(9, 8, 20, 0.6) 100%
      );
  }

  /* Выключенное затемнение = то, что стоит на проде прямо сейчас. */
  .stage[data-scrim='off'] .atmosphere-vignette {
    background: radial-gradient(
      125% 92% at 50% 42%,
      rgba(9, 8, 20, 0) 38%,
      rgba(9, 8, 20, 0.28) 74%,
      rgba(9, 8, 20, 0.6) 100%
    );
  }

  @media (prefers-reduced-motion: reduce) {
    .atmosphere-rays,
    .atmosphere-dust,
    .atmosphere-dust::after,
    .atmosphere-bokeh {
      animation: none;
    }
  }

  /* ===========================================================================
     Смотровая. Цвета взяты из theme.css приложения — нейтральные уведены
     в фиолетовый, чтобы панель не спорила с самой работой.
  =========================================================================== */

  :root {
    --void: #0b0a16;
    --ink: #e8dcff;
    --ink-muted: #8f86b8;
    --hairline: rgba(232, 214, 255, 0.14);
    --accent: #c671bd;
    --accent-live: #743df5;
    --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
  }

  body {
    background: var(--void);
    color: var(--ink);
    font-family:
      system-ui,
      -apple-system,
      sans-serif;
  }

  .stage {
    position: relative;
    height: 100dvh;
    min-height: 520px;
    overflow: hidden;
    background: var(--void);
  }

  .stage .atmosphere {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  /* Ширина колонки приложения. Геометрия лучей зависит от пропорций бокса,
     поэтому 430px — это не «уменьшенный», а другой кадр. */
  .stage[data-frame='phone'] .atmosphere {
    left: 50%;
    right: auto;
    width: min(430px, 100vw);
    transform: translateX(-50%);
    box-shadow: 0 0 0 1px var(--hairline);
  }

  .stage[data-rays='off'] .atmosphere-rays,
  .stage[data-dust='off'] .atmosphere-dust,
  .stage[data-bokeh='off'] .atmosphere-bokeh,
  .stage[data-vignette='off'] .atmosphere-vignette {
    display: none;
  }

  .stage[data-motion='off'] .atmosphere-rays,
  .stage[data-motion='off'] .atmosphere-dust,
  .stage[data-motion='off'] .atmosphere-dust::after,
  .stage[data-motion='off'] .atmosphere-bokeh {
    animation-play-state: paused;
  }

  /* Что в приложении закрыто шапкой и таб-баром — по 5rem сверху и снизу. */
  .crop {
    position: absolute;
    inset: 0;
    display: none;
    pointer-events: none;
  }

  .stage[data-frame='phone'] .crop {
    display: block;
    left: 50%;
    right: auto;
    width: min(430px, 100vw);
    transform: translateX(-50%);
  }

  .crop-band {
    position: absolute;
    left: 0;
    right: 0;
    height: 80px;
    background: rgba(11, 10, 22, 0.55);
    border-block: 1px solid var(--hairline);
  }

  .crop-band:first-child {
    top: 0;
  }
  .crop-band:last-child {
    bottom: 0;
  }

  .crop-band span {
    position: absolute;
    bottom: 6px;
    left: 10px;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .crop-band:last-child span {
    bottom: auto;
    top: 6px;
  }

  /* --- Панель --- */

  .rail {
    position: absolute;
    z-index: 2;
    left: 50%;
    bottom: max(18px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 6px;
    max-width: calc(100vw - 24px);
    padding: 7px 8px;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    background: rgba(11, 10, 22, 0.72);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
  }

  .rail-sep {
    width: 1px;
    align-self: stretch;
    margin-inline: 3px;
    background: var(--hairline);
  }

  button {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 7px 12px;
    cursor: pointer;
    transition:
      color 160ms ease,
      background-color 160ms ease,
      border-color 160ms ease;
  }

  button:hover {
    color: var(--ink);
  }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  button[aria-pressed='true'] {
    color: var(--ink);
    border-color: rgba(198, 113, 189, 0.55);
    background: rgba(116, 61, 245, 0.22);
  }

  .caption {
    position: absolute;
    z-index: 2;
    top: max(16px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(143, 134, 184, 0.75);
    text-align: center;
    pointer-events: none;
  }

  @media (max-width: 520px) {
    button {
      padding: 7px 9px;
      font-size: 9px;
    }
  }
</style>

<div
  class="stage"
  id="stage"
  data-frame="full"
  data-rays="on"
  data-dust="on"
  data-bokeh="on"
  data-vignette="on"
  data-scrim="on"
  data-motion="on"
>
  <div class="atmosphere">
    <div class="atmosphere-rays"></div>
    <div class="atmosphere-dust"></div>
    <div class="atmosphere-bokeh"></div>
    <div class="atmosphere-vignette"></div>
  </div>
  <div class="crop">
    <div class="crop-band"><span>шапка</span></div>
    <div class="crop-band"><span>таб-бар</span></div>
  </div>

  <p class="caption">фон без интерфейса · то же, что на / и /tickets</p>

  <div class="rail" role="group" aria-label="Слои и кадр">
    <button type="button" data-key="rays" aria-pressed="true">Лучи</button>
    <button type="button" data-key="dust" aria-pressed="true">Пыль</button>
    <button type="button" data-key="bokeh" aria-pressed="true">Боке</button>
    <button type="button" data-key="vignette" aria-pressed="true">Виньетка</button>
    <div class="rail-sep"></div>
    <button type="button" data-key="scrim" aria-pressed="true">Затемнение сверху</button>
    <button type="button" data-key="motion" aria-pressed="true">Движение</button>
    <button type="button" data-key="frame" aria-pressed="false">430px</button>
  </div>
</div>

<script>
  const stage = document.getElementById('stage');

  document.querySelectorAll('.rail button').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.key;
      const on = btn.getAttribute('aria-pressed') === 'true';
      btn.setAttribute('aria-pressed', String(!on));

      if (key === 'frame') {
        stage.dataset.frame = on ? 'full' : 'phone';
      } else {
        stage.dataset[key] = on ? 'off' : 'on';
      }
    });
  });
</script>

</body>
</html>
